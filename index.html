<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Finanças</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <h2>Controle Financeiro</h2>

    <div class="container">
        <h4>Saldo Atual</h4>
        <h1 id="balance">R$ 0,00</h1>

        <div class="inc-exp-container">
            <div>
                <h4>Receitas</h4>
                <p id="money-plus" class="money plus">+R$ 0,00</p>
            </div>
            <div>
                <h4>Despesas</h4>
                <p id="money-minus" class="money minus">-R$ 0,00</p>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="expenseChart"></canvas>
        </div>

        <h3>Histórico</h3>
        <ul id="list" class="list">
            </ul>

        <h3>Adicionar Transação</h3>
        <form id="form">
            <div class="form-control">
                <label for="text">Descrição</label>
                <input type="text" id="text" placeholder="Ex: Aluguel, Salário..." />
            </div>
            
            <div class="form-control">
                <label for="category">Categoria</label>
                <select id="category">
                    <option value="Salário">Salário/Renda</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>

            <div class="form-control">
                <label for="amount">Valor <br />
                <small>(negativo = despesa, positivo = receita)</small></label>
                <input type="number" id="amount" placeholder="Ex: -150.00 ou 2000.00" step="0.01" />
            </div>
            <button class="btn">Adicionar Transação</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
